<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .img {
            width: 300px;
            height: 300px;

            img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
        }
    </style>
    <title>設計檔案選擇欄位</title>
</head>

<body>
    <div class="container py-3">
        <div class="input-group group1">
            <input type="text" class="form-control border border-primary text-primary" value="未選擇任何檔案">
            <button class="btn btn-primary">選擇一個檔案</button>
        </div>
        <div id="textArea"></div>
    </div>

    <input type="file" name="file1" class="d-none" accept="text/.csv">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const btnSelectFile = document.querySelector(".group1 button");
        const file1 = document.querySelector("[name=file1]");
        const inputGroup1 = document.querySelector(".group1 input");
        const textArea = document.querySelector("#textArea");

        btnSelectFile.addEventListener("click", () => file1.click());

        file1.addEventListener("change", e => {
            const file = e.target.files[0];
            inputGroup1.value = file.name;
            const reader = new FileReader();
            reader.addEventListener("load", (e) => {
                textArea.innerHTML = e.target.result;
            });

            reader.readAsText(file);
        });
    </script>
</body>

</html>
