<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聲音 2</title>
</head>
<body>
    <script>
        const soundObj = {
            "shoot": "./sounds/shoot.mp3",
            "explo": "./sounds/explo.mp3"
        }

        window.addEventListener("keyup", e => {
            console.log(e.key);
            if(e.key == " "){
                playSound("shoot");
            }else if(e.key == "Enter"){
                playSound("explo");
            }
        });


        function playSound(key){
            const sound = new Audio(soundObj[key]);
            sound.addEventListener("ended", event => {
                event.target = null;
            });
            sound.play();
        }
    </script>
</body>
</html>
